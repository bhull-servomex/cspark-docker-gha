name: Docker Build

on: [push, workflow_dispatch]

jobs:
  DockerBuildPublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
  uses: docker/build-push-action@v6
  with:
    file: python-webapp.Dockerfile
    push: false
    tags: pythonapp:latest